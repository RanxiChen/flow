<text x="600.0" y="40.0" text-anchor="middle" dominant-baseline="middle" font-family="WenQuanYi Micro Hei,Arial,sans-serif" font-size="28" font-weight="600" fill="#0f172a">L1D：Load / Store 共用查询流水，Store 多一拍写入</text>
<text x="600.0" y="84.5" text-anchor="middle" dominant-baseline="middle" font-family="WenQuanYi Micro Hei,Arial,sans-serif" font-size="17" font-weight="400" fill="#0f172a">普通 cache/TLB hit 路径；pending-store 是一项待写寄存器；无数据 forwarding</text>
