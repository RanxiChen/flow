<text x="1040.0" y="481.0" text-anchor="middle" dominant-baseline="middle" font-family="WenQuanYi Micro Hei,Arial,sans-serif" font-size="20" font-weight="600" fill="#0f172a">Store 写入</text>
<text x="1040.0" y="509.0" text-anchor="middle" dominant-baseline="middle" font-family="WenQuanYi Micro Hei,Arial,sans-serif" font-size="20" font-weight="600" fill="#0f172a">字节写使能；无读改写</text>
<rect x="325" y="425" width="255" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="452.5" y="454.8" text-anchor="middle" dominant-baseline="middle" font-family="WenQuanYi Micro Hei,Arial,sans-serif" font-size="18" font-weight="600" fill="#0f172a">冲突判定</text>
<text x="452.5" y="480.0" text-anchor="middle" dominant-baseline="middle" font-family="WenQuanYi Micro Hei,Arial,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Load PA 字 == pending PA 字</text>
<text x="452.5" y="505.2" text-anchor="middle" dominant-baseline="middle" font-family="WenQuanYi Micro Hei,Arial,sans-serif" font-size="18" font-weight="600" fill="#0f172a">或读快照已失效</text>
<text x="967.5" y="387.5" text-anchor="middle" dominant-baseline="middle" font-family="WenQuanYi Micro Hei,Arial,sans-serif" font-size="16" font-weight="400" fill="#0f172a">更老 Store 的物理地址</text>
<text x="600.0" y="612.0" text-anchor="middle" dominant-baseline="middle" font-family="WenQuanYi Micro Hei,Arial,sans-serif" font-size="18" font-weight="400" fill="#0f172a">蓝：查询　紫：最终判定　橙：实际写入　红：丢弃旧快照并重查　绿：结果</text>
